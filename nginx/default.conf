# Link 1: Frontend  ->  http://YOUR-FRONTEND.duckdns.org
server {
  listen 80;
  server_name YOUR-FRONTEND.duckdns.org;

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# Link 2 + 3: Backend / API  ->  http://YOUR-API.duckdns.org:8000
server {
  listen 8000;
  server_name YOUR-API.duckdns.org;

  location / {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
